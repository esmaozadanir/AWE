# TaskFlow — üretkenlik/proje yönetimi uygulaması örnek entegrasyonu.
#
# Üçüncü ve en minimal ham telemetry biçimi (bölüm 4'ün kısa örneğine yakın): kısa alan
# adları, iç içe olmayan düz bir yapı. Adapter portability testleri bu üç konfigürasyonun
# aynı AWE Core üzerinde, motor kodu değişmeden çalıştığını doğrular.
project_id: taskflow
display_name: "TaskFlow — Üretkenlik Uygulaması"
timezone: "UTC"

mapping:
  mapping_version: "taskflow-v1"
  event_id_path: id
  project_id_path: workspace
  subject_id_path: userRef
  session_id_path: visit
  timestamp_path: ts
  action_key_path: element
  screen_path: page
  duration_path: elapsedMs

  source:
    default: client
  effect:
    path: interactionKind
    default: unknown
  trigger:
    path: event
    value_map:
      clicked: button
      swiped: swipe
    default: unknown
  status:
    path: outcome
    value_map:
      success: success
      failure: fail
      cancelled: cancel
    default: unknown

  target:
    ref_path: entity

engine_overrides:
  habit:
    min_distinct_sessions: 3
    min_distinct_days: 2
