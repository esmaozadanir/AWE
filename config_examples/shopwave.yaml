# ShopWave — e-ticaret uygulaması örnek entegrasyonu.
#
# Bu müşterinin raw telemetry formatı canonical Observation alanlarına yakın isimlendirme
# kullanır (bölüm 4'teki örnek ham event ile aynı aile). Adapter mapping yine de gereklidir:
# AWE Core hiçbir zaman "eventId", "projectId" gibi müşteriye özel alan adlarını bilmez.
project_id: shopwave
display_name: "ShopWave — E-Ticaret Uygulaması"
timezone: "Europe/Istanbul"

mapping:
  mapping_version: "shopwave-v1"
  event_id_path: eventId
  project_id_path: projectId
  subject_id_path: subjectId
  session_id_path: sessionId
  timestamp_path: timestamp
  action_key_path: actionKey
  screen_path: screen
  duration_path: durationMs

  source:
    path: source
    default: unknown
  effect:
    path: effect
    default: unknown
  trigger:
    path: trigger
    default: unknown
  status:
    path: status
    default: unknown

  target:
    ref_path: target.ref

engine_overrides:
  habit:
    min_distinct_sessions: 3
    min_distinct_days: 2
