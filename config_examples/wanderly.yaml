# Wanderly — seyahat uygulaması. Domain portability için (bölüm 121).
# ShopWave ile aynı mapping şeklini paylaşır, yalnızca iş sözlüğü (action_key değerleri)
# farklıdır — bu da AWE Core'un domain-independence iddiasının bir parçasıdır: aynı mapping
# şekli farklı iş sözlükleriyle sorunsuz çalışır.
project_id: wanderly
display_name: "Wanderly — Seyahat Uygulaması"
timezone: "UTC"

mapping:
  mapping_version: "wanderly-v1"
  event_id_path: eventId
  project_id_path: projectId
  subject_id_path: subjectId
  session_id_path: sessionId
  timestamp_path: timestamp
  action_key_path: actionKey
  screen_path: screen
  widget_path: widget
  app_version_path: appVersion

  source:
    path: source
    default: unknown
  role:
    path: role
    default: action
  effect:
    path: effect
    default: unknown
  trigger:
    path: trigger
    default: unknown
  status:
    path: status
    default: unknown

  target:
    ref_path: target.ref

  parameter_fields:
    caption: metadata.caption
    audience: metadata.audience

  breaks_episode_path: breaksEpisode
  breaks_episode_action_keys:
    - log_out

  assume_timezone: "UTC"

engine_overrides:
  habit:
    min_occurrences: 3
    min_distinct_sessions: 2
    min_distinct_days: 3
